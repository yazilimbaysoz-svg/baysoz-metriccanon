# Baysöz Labs <baysozlabs@proton.me> — baysoz-metriccanon continuous integration.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install toolchain
        run: python -m pip install uv ruff semgrep pytest
      - name: Create environment and install
        run: |
          uv venv
          uv pip install -e .
          uv pip install pytest
      - name: Tests
        run: uv run pytest -q
      - name: Lint and security gates
        run: |
          ruff check --select E,F,W,S,B .
          semgrep --config p/default --error .
      - name: Attribution gate
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              path for path in Path('.').rglob('*')
              if path.is_file() and '.git/' not in str(path) and '.venv/' not in str(path)
          ]
          missing = [
              str(path) for path in files
              if path.suffix in {'.py', '.md', '.toml', '.yml', '.yaml', '.txt', '.json', '.gitignore'}
              and path.name != '.factory-result.json'
              and 'baysozlabs@proton.me' not in path.read_text(encoding='utf-8', errors='ignore')
          ]
          if missing:
              raise SystemExit('missing Baysöz Labs attribution: ' + ', '.join(missing))
          PY
      - name: CLI live smoke
        run: |
          uv run baysoz-metriccanon --version
          uv run baysoz-metriccanon --help
          uv run baysoz-metriccanon tests/fixtures/clean.snapshot.json --format json
